plugins { id 'com.android.application' }
android {
    namespace 'dev.local.timoreply'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.local.timoreply'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Use the existing ignored local debug key for consistent on-device updates.
    def localDebugKey = rootProject.file('work/manual-build/debug.keystore')
    if (localDebugKey.exists()) {
        signingConfigs {
            debug {
                storeFile localDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
